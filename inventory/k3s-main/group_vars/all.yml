---
# Generated by Terraform — do not edit manually.
# Source: terraform/02-k3s/templates/all.yml.tpl

k3s_version: "v1.32.3+k3s1"
ansible_user: ubuntu
systemd_dir: /etc/systemd/system
system_timezone: "America/Chicago"

# Virtual IP for the k3s API server (kube-vip)
apiserver_endpoint: "10.10.0.10"

# Cluster join token
k3s_token: "8c2128a0ff8189cbdd3d0b8fdb169a38c191cc6d570248faa034ea61ae768cdf"

# Taint master nodes so workloads only run on workers (true when worker nodes exist)
k3s_master_taint: "{{ true if groups['node'] | default([]) | length >= 1 else false }}"

# Network interface used by Flannel (default CNI)
flannel_iface: "eth0"

# The IP on which the node is reachable — resolved per-host via ansible_facts
k3s_node_ip: "{{ ansible_facts[flannel_iface]['ipv4']['address'] }}"

# Cluster pod CIDR
cluster_cidr: "10.52.0.0/16"

# Not using Cilium — must be defined so the MetalLB conditional in k3s_server does not error
cilium_bgp: false

# kube-vip — HA virtual IP for the control plane
kube_vip_arp: true
kube_vip_tag_version: "v1.0.4"
kube_vip_bgp: false

# MetalLB — LoadBalancer IP pool for services (e.g. Traefik)
metal_lb_type: native
metal_lb_mode: layer2
metal_lb_ip_range: "10.10.0.50-10.10.0.250"
metal_lb_controller_tag_version: "v0.15.3"
metal_lb_speaker_tag_version: "v0.15.3"

# k3s startup arguments passed to every node
extra_args: >-
  --flannel-iface={{ flannel_iface }}
  --node-ip={{ k3s_node_ip }}

# Additional arguments for master (server) nodes only
extra_server_args: >-
  {{ extra_args }}
  {{ '--node-taint node-role.kubernetes.io/master=true:NoSchedule' if k3s_master_taint else '' }}
  --tls-san 10.10.0.10
  --disable servicelb
  --disable traefik

# Additional arguments for worker (agent) nodes only
extra_agent_args: >-
  {{ extra_args }}

# Not using Proxmox LXC containers
proxmox_lxc_configure: false

# Not using private registries
custom_registries: false

# Give the cluster more time to form (default 20 is too short for fresh VMs)
retry_count: 50
